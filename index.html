<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<title>Fuel Tracker</title>
<style>
:root{--bg:#0f0b24;--card:#1b1540;--card2:#251d57;--tx:#f4f1ff;--mut:#a79fd6;--a:#ff6b6b;--b:#ffb347;--g:#34d399;--p:#8b5cf6;--c:#22d3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#3b1d8f55,transparent),var(--bg);color:var(--tx);min-height:100vh;padding-bottom:90px}
header{padding:20px 18px 6px;font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--b),var(--a),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
main{padding:10px 16px;max-width:560px;margin:auto}
.card{background:linear-gradient(145deg,var(--card),var(--card2));border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0006}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chip{padding:10px 16px;border-radius:999px;background:var(--card);color:var(--mut);border:0;font-size:15px;white-space:nowrap}
.chip.on{background:linear-gradient(90deg,var(--p),var(--a));color:#fff;font-weight:700}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #3b3290;background:#150f35;color:var(--tx);font-size:17px}
.row{display:flex;gap:10px}.row>*{flex:1}
.big{width:100%;margin-top:16px;padding:16px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--b),var(--a))}
.sm{padding:8px 12px;border:0;border-radius:10px;background:#3b3290;color:#fff;font-size:13px}
.sm.d{background:#7f1d1d}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#120d2ccc;backdrop-filter:blur(12px);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;padding:6px}
nav button b{display:block;font-size:22px}
nav button.on{color:var(--b)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#150f3588;border-radius:14px;padding:12px}
.stat small{color:var(--mut);display:block;font-size:11px}
.stat span{font-size:20px;font-weight:800}
.stat span.m{color:var(--g)}
h3{margin:4px 0 10px;font-size:15px;color:var(--c)}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff14;gap:8px}
.item small{color:var(--mut)}
.hide{display:none}
.home label{font-size:15px;margin-top:14px}
.home input,.home select{font-size:24px;padding:18px;border-radius:16px}
.home .big{font-size:24px;padding:22px;border-radius:20px}
.home .chip{font-size:19px;padding:14px 22px}
.home .card{padding:20px}
svg{width:100%;height:auto;display:block}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#052;padding:10px 18px;border-radius:999px;font-weight:700;z-index:9}
.note{color:var(--mut);font-size:12px;line-height:1.5}
</style>
</head>
<body>
<header>⛽ Fuel Tracker</header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY='fuelTracker.v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{vehicles:[{id:'car',name:'Car',icon:'🚗'},{id:'bike',name:'Bike',icon:'🏍️'}],entries:[],settings:{}};
let rv='all',rg='month',cg='month',tab='add',vid=db.vehicles[0].id,editId=null,period='month',last=[];
const save=()=>{db.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(db))};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const FUELS=['Regular Petrol','Shell V-Power','HP Power','IOC XP95','Other Premium'];
const vmax=v=>v.max||(v.id==='car'?25:v.id==='bike'?45:40);
const inr=(n,d=0)=>Number.isFinite(n)?'₹'+n.toLocaleString('en-IN',{maximumFractionDigits:d}):'–';
const f=(n,d=1)=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:d}):'–';
const veh=id=>db.vehicles.find(v=>v.id===id)||{name:'?',icon:''};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)};

// No full-tank assumption: fuel bought at a fill-up is what powers the km driven
// until the NEXT fill-up. So each segment = km between two readings / litres of the earlier fill.
// The segment is dated at the later fill-up (when the km were completed).
function segments(id){
  const es=db.entries.filter(e=>e.v===id&&e.odo>0).sort((a,b)=>a.t.localeCompare(b.t));
  const out=[];
  for(let i=1;i<es.length;i++){
    const km=es[i].odo-es[i-1].odo;
    if(km>0)out.push({t:es[i].t,km,l:es[i-1].l,amt:es[i-1].amt,fuel:es[i-1].fuel||FUELS[0],days:(new Date(es[i].t)-new Date(es[i-1].t))/864e5});
  }
  return out;
}
// Entry times are local "YYYY-MM-DDTHH:mm" strings; compare in the same format
function startOf(p){
  const d=new Date();d.setHours(0,0,0,0);
  if(p==='week')d.setDate(d.getDate()-((d.getDay()+6)%7));
  else if(p==='month')d.setDate(1);
  else if(p==='year')d.setMonth(0,1);
  else return '0000';
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function stats(ids,p){
  const from=startOf(p);let km=0,sl=0,cost=0,l=0,fills=0;
  for(const id of ids){
    const es=db.entries.filter(e=>e.v===id&&e.t>=from);
    cost+=es.reduce((a,e)=>a+e.amt,0);l+=es.reduce((a,e)=>a+e.l,0);fills+=es.length;
    for(const s of segments(id).filter(s=>s.t>=from)){km+=s.km;sl+=s.l}
  }
  return{km,cost,l,fills,mil:sl?km/sl:NaN,cpk:km?cost/km:NaN};
}
function weekKey(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function buckets(g){
  const out=[],now=new Date();
  if(g==='week'){const d=new Date(now);d.setDate(d.getDate()-7*11);for(let i=0;i<12;i++){out.push({k:weekKey(d),lb:d.getDate()+' '+d.toLocaleString([],{month:'short'})});d.setDate(d.getDate()+7)}}
  else if(g==='month'){for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),lb:d.toLocaleString([],{month:'short'})})}}
  else{const ys=db.entries.map(e=>+e.t.slice(0,4));const y0=Math.min(now.getFullYear()-2,...ys);for(let y=y0;y<=now.getFullYear();y++)out.push({k:''+y,lb:''+y})}
  return out;
}
const COLORS=['#ffb347','#8b5cf6','#22d3ee','#34d399','#ff6b6b','#f472b6'];
const bkey=(g,t)=>g==='week'?weekKey(t):g==='month'?t.slice(0,7):t.slice(0,4);
const niceStep=r=>{for(const n of [.1,.2,.5,1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000])if(n>=r)return n;return 100000};
const compact=n=>n>=1000?+(n/1000).toFixed(1)+'k':Math.round(n);
const svgOpen=()=>`<svg viewBox="0 0 340 210"><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b" stop-opacity=".35"/><stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/></linearGradient></defs>`;
function axes(bs,lo,hi,step,fmt,xs){
  const W=340,H=210,L=34,R=10,T=18,B=30,ph=H-T-B,Y=m=>T+ph-((m-lo)/(hi-lo))*ph;
  let o='';
  for(let m=lo;m<=hi+1e-9;m+=step)o+=`<line x1="${L}" x2="${W-R}" y1="${Y(m)}" y2="${Y(m)}" stroke="#ffffff1a"/><text x="${L-5}" y="${Y(m)+4}" font-size="10" fill="#a79fd6" text-anchor="end">${fmt(m)}</text>`;
  const every=bs.length>8?2:1;
  bs.forEach((b,i)=>{if(i%every===0||i===bs.length-1)o+=`<text x="${xs(i)}" y="${H-10}" font-size="9" fill="#a79fd6" text-anchor="middle">${b.lb}</text>`});
  return{o,Y};
}
// pts: value per bucket or null. opts: lo,hi,step,fmt,label
function lineChart(bs,pts,{lo=0,hi,step,fmt=x=>f(x),label=fmt}){
  const W=340,L=34,R=10,pw=W-L-R,X=i=>L+(bs.length>1?i*pw/(bs.length-1):pw/2);
  const {o,Y}=axes(bs,lo,hi,step,fmt,X);
  let svg=svgOpen()+o,run=[];const runs=[];
  pts.forEach((m,i)=>{if(m===null){if(run.length)runs.push(run);run=[]}else run.push([X(i),Y(m)])});if(run.length)runs.push(run);
  for(const r of runs)if(r.length>1){const d=r.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(' ');
    svg+=`<path d="${d} L${r[r.length-1][0]} ${Y(lo)} L${r[0][0]} ${Y(lo)}Z" fill="url(#ga)"/><path d="${d}" fill="none" stroke="url(#gl)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`}
  pts.forEach((m,i)=>{if(m!==null)svg+=`<circle cx="${X(i)}" cy="${Y(m)}" r="4" fill="#fff" stroke="#ff6b6b" stroke-width="2"/><text x="${X(i)}" y="${Y(m)-8}" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">${label(m)}</text>`});
  if(!pts.some(x=>x!==null))svg+=`<text x="170" y="105" font-size="12" fill="#a79fd6" text-anchor="middle">No data yet</text>`;
  return svg+'</svg>';
}
// series: [{name,color,vals[]}] stacked
function barChart(bs,series,fmt){
  const W=340,L=34,R=10,pw=W-L-R,n=bs.length,bw=Math.min(26,pw/n*.6),X=i=>L+pw/n*(i+.5);
  const tot=bs.map((_,i)=>series.reduce((a,s)=>a+(s.vals[i]||0),0));
  const mx=Math.max(...tot),step=niceStep((mx||1)/4),hi=Math.max(step,Math.ceil(mx/step)*step);
  const {o,Y}=axes(bs,0,hi,step,fmt,X);
  let svg=svgOpen()+o;
  bs.forEach((_,i)=>{let base=0;series.forEach(s=>{const v=s.vals[i]||0;if(v>0){svg+=`<rect x="${X(i)-bw/2}" y="${Y(base+v)}" width="${bw}" height="${Y(base)-Y(base+v)}" rx="3" fill="${s.color}"/>`;base+=v}});
    if(tot[i]>0)svg+=`<text x="${X(i)}" y="${Y(tot[i])-4}" font-size="9" font-weight="700" fill="#f4f1ff" text-anchor="middle">${fmt(tot[i])}</text>`});
  if(!mx)svg+=`<text x="170" y="105" font-size="12" fill="#a79fd6" text-anchor="middle">No data yet</text>`;
  svg+='</svg>';
  if(series.length>1)svg+=`<p class="note">${series.map(s=>`<span style="color:${s.color}">●</span> ${s.name}`).join(' &nbsp; ')}</p>`;
  return svg;
}
function chartHTML(id,g){
  const bs=buckets(g),acc={};
  for(const sg of segments(id)){const k=bkey(g,sg.t);(acc[k]=acc[k]||{km:0,l:0});acc[k].km+=sg.km;acc[k].l+=sg.l}
  const pts=bs.map(b=>acc[b.k]&&acc[b.k].l?acc[b.k].km/acc[b.k].l:null);
  const hi=Math.max(vmax(veh(id)),Math.ceil(Math.max(0,...pts.filter(x=>x!==null))));
  return lineChart(bs,pts,{hi,step:hi<=30?5:10});
}
// ---------- Spends tab ----------
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T00:00';
function prevRange(p){
  const to=new Date(startOf(p)),from=new Date(to);
  if(p==='week')from.setDate(from.getDate()-7);else if(p==='month')from.setMonth(from.getMonth()-1);else from.setFullYear(from.getFullYear()-1);
  return[ymd(from),ymd(to)];
}
function periodTotals(ids,p){
  const cur=stats(ids,p);if(p==='all')return{cur};
  const [a,b]=prevRange(p);let cost=0,km=0;
  for(const id of ids){
    cost+=db.entries.filter(e=>e.v===id&&e.t>=a&&e.t<b).reduce((x,e)=>x+e.amt,0);
    km+=segments(id).filter(s=>s.t>=a&&s.t<b).reduce((x,s)=>x+s.km,0);
  }
  return{cur,prev:{cost,km}};
}
const delta=(c,p)=>p>0?`<small style="color:${c>p?'#ff6b6b':'#34d399'}">${c>p?'▲':'▼'} ${Math.abs(Math.round((c-p)/p*100))}%</small>`:'';
function splitRows(rows){
  const tot=rows.reduce((a,x)=>a+x.v,0)||1;
  return rows.filter(x=>x.v>0).map(x=>`<div style="margin:10px 0"><div class="item" style="border:0;padding:0"><span>${x.n}</span><b>${inr(x.v)} · ${Math.round(x.v/tot*100)}%</b></div><div style="height:8px;border-radius:6px;background:#150f35"><div style="height:8px;border-radius:6px;width:${x.v/tot*100}%;background:${x.c}"></div></div></div>`).join('')||'<p class="note">No data yet.</p>';
}
function reportsHTML(){
  const ids=rv==='all'?db.vehicles.map(v=>v.id):[rv],bs=buckets(rg),gl={week:'weekly',month:'monthly',year:'yearly'}[rg];
  const colorOf=id=>COLORS[db.vehicles.findIndex(v=>v.id===id)%COLORS.length];
  const seriesFor=fn=>ids.map(id=>({name:veh(id).name,color:colorOf(id),vals:bs.map(b=>fn(id,b.k))}));
  const spend=(id,k)=>db.entries.filter(e=>e.v===id&&bkey(rg,e.t)===k).reduce((a,e)=>a+e.amt,0);
  const kms=(id,k)=>segments(id).filter(s=>bkey(rg,s.t)===k).reduce((a,s)=>a+s.km,0);
  const allSeg=ids.flatMap(id=>segments(id));
  const sumB=(arr,k,fld)=>arr.filter(s=>bkey(rg,s.t)===k).reduce((a,s)=>a+s[fld],0);
  const cpkPts=bs.map(b=>{const km=sumB(allSeg,b.k,'km');return km?sumB(allSeg,b.k,'amt')/km:null});
  const cpkVals=cpkPts.filter(x=>x!==null),cpkHi=cpkVals.length?Math.ceil(Math.max(...cpkVals)*1.2):1;
  const allE=db.entries.filter(e=>ids.includes(e.v));
  const pplPts=bs.map(b=>{const es=allE.filter(e=>bkey(rg,e.t)===b.k),l=es.reduce((a,e)=>a+e.l,0);return l?es.reduce((a,e)=>a+e.amt,0)/l:null});
  const pv=pplPts.filter(x=>x!==null),pst=pv.length?niceStep((Math.max(...pv)-Math.min(...pv)||2)/3):1;
  const plo=pv.length?Math.floor(Math.min(...pv)/pst)*pst-pst*0:0,phi=pv.length?Math.max(plo+pst*2,Math.ceil(Math.max(...pv)/pst)*pst+pst):1;
  const milPts=bs.map(b=>{const l=sumB(allSeg,b.k,'l');return l?sumB(allSeg,b.k,'km')/l:null});
  const mv=milPts.map((m,i)=>[m,bs[i].lb]).filter(x=>x[0]!==null);
  const best=mv.length?mv.reduce((a,b)=>b[0]>a[0]?b:a):null,worst=mv.length?mv.reduce((a,b)=>b[0]<a[0]?b:a):null;
  const bestFill=allSeg.length?allSeg.reduce((a,s)=>s.km/s.l>a.km/a.l?s:a):null;
  const longest=allSeg.length?allSeg.reduce((a,s)=>s.km>a.km?s:a):null;
  const withOdo=allE.filter(e=>e.odo>0).sort((a,b)=>a.t.localeCompare(b.t));
  const span=withOdo.length>1?(new Date(withOdo.at(-1).t)-new Date(withOdo[0].t))/864e5:0;
  const kmDay=span>0?(withOdo.at(-1).odo-withOdo[0].odo)/span:NaN;
  const fuels={};for(const s of allSeg){const x=fuels[s.fuel]=fuels[s.fuel]||{km:0,l:0,amt:0};x.km+=s.km;x.l+=s.l;x.amt+=s.amt}
  const dt=new Date;
  const totals=['week','month','year','all'].map(p=>{const {cur,prev}=periodTotals(ids,p),n={week:'This week',month:'This month',year:'This year',all:'Overall'}[p];
    return `<div class="stat"><small>${n}</small><span>${inr(cur.cost)}</span> ${prev?delta(cur.cost,prev.cost):''}<br><small>${f(cur.km,0)} km${prev?' · prev '+inr(prev.cost):''}</small></div>`}).join('');
  const vchips=`<div class="chips"><button class="chip ${rv==='all'?'on':''}" onclick="rv='all';render()">All</button>${db.vehicles.map(v=>`<button class="chip ${v.id===rv?'on':''}" onclick="rv='${v.id}';render()">${v.icon} ${v.name}</button>`).join('')}</div>`;
  const gchips=`<div class="chips">${[['week','Weeks'],['month','Months'],['year','Years']].map(([k,n])=>`<button class="chip ${k===rg?'on':''}" onclick="rg='${k}';render()">${n}</button>`).join('')}</div>`;
  return vchips+`<div class="card"><h3>💰 Spend summary</h3><div class="grid">${totals}</div></div>`+gchips+
  `<div class="card"><h3>Fuel spend (${gl})</h3>${barChart(bs,seriesFor(spend),x=>'₹'+compact(x))}</div>`+
  `<div class="card"><h3>Km driven (${gl})</h3>${barChart(bs,seriesFor(kms),compact)}</div>`+
  `<div class="card"><h3>Cost per km (${gl})</h3>${lineChart(bs,cpkPts,{hi:cpkHi,step:niceStep(cpkHi/4),fmt:x=>'₹'+f(x,1),label:x=>'₹'+f(x,1)})}</div>`+
  `<div class="card"><h3>Price per litre trend</h3>${lineChart(bs,pplPts,{lo:plo,hi:phi,step:pst,fmt:x=>'₹'+f(x,0),label:x=>f(x,1)})}</div>`+
  `<div class="card"><h3>Spend split</h3>${rv==='all'?'<p class="note">By vehicle</p>'+splitRows(db.vehicles.map(v=>({n:v.icon+' '+v.name,v:db.entries.filter(e=>e.v===v.id).reduce((a,e)=>a+e.amt,0),c:colorOf(v.id)}))):''}<p class="note">By fuel type</p>${splitRows(FUELS.map((n,i)=>({n,v:allE.filter(e=>(e.fuel||FUELS[0])===n).reduce((a,e)=>a+e.amt,0),c:COLORS[i%COLORS.length]})))}</div>`+
  `<div class="card"><h3>Regular vs premium</h3>${Object.keys(fuels).length?'<div class="grid">'+Object.entries(fuels).map(([n,x])=>`<div class="stat"><small>${n}</small><span class="m">${f(x.km/x.l)} km/L</span><br><small>${inr(x.amt/x.km,2)}/km · ${f(x.km,0)} km</small></div>`).join('')+'</div><p class="note">Fuel type is taken from the fill-up that powered each stretch.</p>':'<p class="note">No data yet.</p>'}</div>`+
  `<div class="card"><h3>Highlights</h3><div class="grid">
  <div class="stat"><small>Avg km / day</small><span>${f(kmDay,1)}</span></div>
  <div class="stat"><small>Longest stretch</small><span>${longest?f(longest.km,0)+' km':'–'}</span><br><small>${longest?f(longest.days,1)+' days':''}</small></div>
  <div class="stat"><small>Best ${rg}</small><span class="m">${best?f(best[0])+' km/L':'–'}</span><br><small>${best?best[1]:''}</small></div>
  <div class="stat"><small>Worst ${rg}</small><span>${worst?f(worst[0])+' km/L':'–'}</span><br><small>${worst?worst[1]:''}</small></div>
  <div class="stat" style="grid-column:span 2"><small>Best single fill-up</small><span class="m">${bestFill?f(bestFill.km/bestFill.l)+' km/L':'–'}</span><small>${bestFill?' · '+new Date(bestFill.t).toLocaleDateString([],{dateStyle:'medium'})+' · '+bestFill.fuel:''}</small></div></div></div>`;
}
function exportCSV(){
  const rows=[['date','vehicle','fuel','amount_inr','litres','price_per_litre','odometer_km']];
  for(const e of db.entries.slice().sort((a,b)=>a.t.localeCompare(b.t)))rows.push([e.t.replace('T',' '),veh(e.v).name,e.fuel||FUELS[0],e.amt,e.l,+(e.amt/e.l).toFixed(2),e.odo]);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));
  a.download='fuel-tracker.csv';a.click();
}
const statHTML=s=>`<div class="grid">
<div class="stat"><small>Km driven</small><span>${f(s.km,0)}</span></div>
<div class="stat"><small>Avg mileage (km/L)</small><span class="m">${f(s.mil)}</span></div>
<div class="stat"><small>Fuel cost</small><span>${inr(s.cost)}</span></div>
<div class="stat"><small>Litres</small><span>${f(s.l)}</span></div>
<div class="stat"><small>Cost / km</small><span>${inr(s.cpk,2)}</span></div>
<div class="stat"><small>Fill-ups</small><span>${s.fills}</span></div></div>`;

const chips=()=>`<div class="chips">${db.vehicles.map(v=>`<button class="chip ${v.id===vid?'on':''}" onclick="vid='${v.id}';render()">${v.icon} ${v.name}</button>`).join('')}</div>`;

function formHTML(e){
  e=e||{t:nowLocal(),v:vid};last=[];
  return `<div class="card">
  <div class="row"><div><label>Total amount (₹)</label><input id="amt" type="number" inputmode="decimal" step="any" value="${e.amt??''}" oninput="calc('amt')"></div>
  <div><label>Litres</label><input id="l" type="number" inputmode="decimal" step="any" value="${e.l??''}" oninput="calc('l')"></div></div>
  <div class="row"><div><label>Price per litre (₹)</label><input id="ppl" type="number" inputmode="decimal" step="any" value="${e.amt&&e.l?+(e.amt/e.l).toFixed(2):''}" oninput="calc('ppl')"></div>
  <div><label>Odometer (km) *</label><input id="odo" type="number" inputmode="numeric" value="${e.odo||''}"></div></div>
  <label>Fuel type</label><select id="fuel">${FUELS.map(x=>`<option ${x===(e.fuel||FUELS[0])?'selected':''}>${x}</option>`).join('')}</select>
  <label>Date &amp; time (auto, editable)</label><input id="t" type="datetime-local" value="${e.t}">
  <p class="note">Fill any two of amount / litres / price — the third is calculated. Partial fills are fine; mileage uses the km driven after each fill.</p>
  </div>`;
}
function calc(src){
  last=[src,...last.filter(x=>x!==src)].slice(0,2);
  if(last.length<2)return;
  const [a,l,p]=['amt','l','ppl'].map(i=>parseFloat($('#'+i).value));
  const set=(i,v)=>{if(Number.isFinite(v))$('#'+i).value=+v.toFixed(2)};
  const miss=['amt','l','ppl'].find(x=>!last.includes(x));
  if(miss==='amt')set('amt',l*p);else if(miss==='l')set('l',a/p);else set('ppl',a/l);
}
function readForm(){
  const amt=parseFloat($('#amt').value),l=parseFloat($('#l').value);
  if(!(amt>0)||!(l>0)){toast('Enter any two of amount / litres / price');return null}
  const odo=parseFloat($('#odo').value),t=$('#t').value||nowLocal();
  if(!(odo>0)){toast('Odometer reading is required');return null}
  const o=db.entries.filter(e=>e.v===(editId?db.entries.find(x=>x.id===editId).v:vid)&&e.id!==editId&&e.odo>0).sort((a,b)=>a.t.localeCompare(b.t));
  const before=o.filter(e=>e.t<=t).pop(),after=o.find(e=>e.t>t);
  if(before&&odo<=before.odo||after&&odo>=after.odo){toast('Odometer must fit between neighbouring entries');return null}
  return{amt,l,odo,fuel:$('#fuel').value,t};
}
function add(){
  const r=readForm();if(!r)return;
  db.entries.push({id:uid(),v:vid,...r});save();toast('Saved ✓');render();
  if(db.settings.autoBackup)pushGist(true);
}
function saveEdit(){
  const r=readForm();if(!r)return;
  Object.assign(db.entries.find(e=>e.id===editId),r);editId=null;save();toast('Updated ✓');tab='history';render();
  if(db.settings.autoBackup)pushGist(true);
}
function del(id){if(confirm('Delete this entry?')){db.entries=db.entries.filter(e=>e.id!==id);save();render()}}
function edit(id){editId=id;vid=db.entries.find(x=>x.id===id).v;tab='edit';render()}

function views(){
  if(tab==='add')return banner()+chips()+formHTML()+`<button class="big" onclick="add()">＋ Add fill-up</button>`+quick();
  if(tab==='edit'){const e=db.entries.find(x=>x.id===editId);return `<h3>Edit entry · ${veh(e.v).icon} ${veh(e.v).name}</h3>`+formHTML(e)+`<button class="big" onclick="saveEdit()">Save changes</button><button class="big" style="background:#3b3290" onclick="tab='history';render()">Cancel</button>`}
  if(tab==='stats'){
    const lbl=period==='all'?'Till date':'This '+period;
    return chips()+`<div class="chips">${['week','month','year','all'].map(p=>`<button class="chip ${p===period?'on':''}" onclick="period='${p}';render()">${p==='all'?'Overall':'This '+p}</button>`).join('')}</div>`+
    `<div class="card"><h3>${veh(vid).icon} ${veh(vid).name} · ${lbl}</h3>${statHTML(stats([vid],period))}</div>`+
    `<div class="card"><h3>📈 ${veh(vid).name} mileage (km/L)</h3><div class="chips">${[['week','Weeks'],['month','Months'],['year','Years']].map(([k,n])=>`<button class="chip ${k===cg?'on':''}" onclick="cg='${k}';render()">${n}</button>`).join('')}</div>${chartHTML(vid,cg)}<p class="note">Scale 0–${vmax(veh(vid))} km/L (set per vehicle in Backup tab).</p></div>`+
    `<div class="card"><h3>All vehicles · ${lbl}</h3>${statHTML(stats(db.vehicles.map(v=>v.id),period))}</div>`;
  }
  if(tab==='reports')return reportsHTML();
  if(tab==='history')return chips()+`<div class="card">${db.entries.filter(e=>e.v===vid).sort((a,b)=>b.t.localeCompare(a.t)).map(e=>`<div class="item"><div><b>${inr(e.amt,2)}</b> · ${f(e.l,2)} L <small>@ ${inr(e.amt/e.l,2)}</small><br><small>${new Date(e.t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})}${e.odo?' · '+f(e.odo,0)+' km':''}${e.fuel&&e.fuel!==FUELS[0]?' · '+e.fuel:''}</small></div><div><button class="sm" onclick="edit('${e.id}')">Edit</button> <button class="sm d" onclick="del('${e.id}')">✕</button></div></div>`).join('')||'<p class="note">No entries yet.</p>'}</div>`;
  return settings();
}
function quick(){
  const es=db.entries.filter(e=>e.v===vid).sort((a,b)=>b.t.localeCompare(a.t));
  if(!es.length)return '';
  const s=stats([vid],'all');
  return `<div class="card"><h3>Overall · ${veh(vid).name}</h3><div class="grid"><div class="stat"><small>Avg mileage</small><span class="m">${f(s.mil)} km/L</span></div><div class="stat"><small>Last odometer</small><span>${f(es.find(e=>e.odo)?.odo,0)}</span></div></div></div>`;
}
function settings(){
  const s=db.settings;
  return `<div class="card"><h3>Vehicles</h3>${db.vehicles.map(v=>`<div class="item"><span>${v.icon}</span><input value="${v.name.replace(/"/g,'&quot;')}" onchange="renVeh('${v.id}',this.value)" style="flex:2"><input type="number" value="${vmax(v)}" title="Chart max km/L" onchange="maxVeh('${v.id}',this.value)" style="flex:1"><button class="sm d" onclick="rmVeh('${v.id}')">✕</button></div>`).join('')}<p class="note">Edit the name, and the chart max (best km/L) in the number box.</p>
  <div class="row" style="margin-top:10px"><input id="vn" placeholder="New vehicle name"><button class="sm" style="flex:0 0 80px" onclick="addVeh()">Add</button></div></div>
  ${statusHTML()}
  <div class="card"><h3>1 · GitHub auto-backup (recommended)</h3>
  <p class="note">One file in a private Gist, overwritten on every upload. GitHub keeps older versions, so there is no pile of files.</p>
  <p class="note"><b>One-time setup</b><br>1. Open <a style="color:#22d3ee" href="https://github.com/settings/tokens/new" target="_blank">github.com/settings/tokens/new</a> (classic token).<br>2. Name: fuel tracker · Expiry: 1 year · tick <b>only “gist”</b>.<br>3. Generate, copy the token (starts with ghp_). It is shown only once.<br>4. Paste it below, tap <b>Upload</b>.<br>5. Turn on <b>Auto-upload</b>. Done. Check “Last GitHub backup” above.</p>
  <label>Personal access token</label><input id="tok" type="password" value="${s.token||''}" onchange="setS('token',this.value.trim())">
  <label>Gist ID (filled automatically; optional when restoring)</label><input id="gid" value="${s.gistId||''}" onchange="setS('gistId',this.value.trim())">
  <div class="row" style="margin-top:10px"><button class="sm" onclick="pushGist()">☁ Upload now</button><button class="sm" onclick="pullGist()">☁ Restore from GitHub</button></div>
  <label><input type="checkbox" style="width:auto" ${s.autoBackup?'checked':''} onchange="setS('autoBackup',this.checked)"> Auto-upload after each entry</label>
  <p class="note">The token stays on this phone only and is never in backup files.</p></div>
  <div class="card"><h3>2 · File backup (occasional extra copy)</h3>
  <div class="row"><button class="sm" onclick="exportFile(true)">📤 Save to Drive / Share</button><button class="sm" onclick="exportFile()">⬇ Download</button></div>
  <div class="row" style="margin-top:8px"><button class="sm" onclick="$('#imp').click()">⬆ Restore from file</button><button class="sm" onclick="exportCSV()">📄 CSV (Excel)</button></div>
  <input id="imp" type="file" accept=".json" class="hide" onchange="importFile(this.files[0])">
  <p class="note">The file is always named <b>fuel-tracker-backup.json</b> and contains the save date inside. Do this only about once a month so you don't collect many files. In Google Drive choose <b>Replace</b>/“new version” when asked, or delete the older copy. Android may add “(1)” to repeated downloads — delete the old ones.</p></div>
  <div class="card"><h3>📱 New phone / lost data? Restore in 1 minute</h3>
  <p class="note"><b>Option A — from GitHub (easiest)</b><br>1. Open the app link in Chrome and add it to the home screen.<br>2. Go to Backup tab → GitHub card.<br>3. Create a new token (steps above) or use your saved one, and paste it. The Gist ID can be left empty.<br>4. Tap <b>Restore from GitHub</b>, then OK.<br>5. Check History and Stats. Then turn on Auto-upload again.<br><br><b>Option B — from a file</b><br>1. Copy <b>fuel-tracker-backup.json</b> from Google Drive to the phone (Drive app → ⋮ → Download).<br>2. Backup tab → <b>Restore from file</b> → choose it → OK.<br><br>Restore replaces all data on the phone with the backup, so do it on a fresh install.</p></div>
  <div class="card"><h3>📖 How to keep your data safe</h3>
  <p class="note"><b>Where is my data?</b> Only inside this browser on this phone. The website itself stores nothing, so there is no server copy unless you back up.</p>
  <p class="note"><b>Do</b><br>• Back up once a week (e.g. every Sunday) and after adding many entries. The status card above shows when you last did it.<br>• Best: turn on GitHub auto-upload so every entry is saved automatically (needs the token below).<br>• Also save a file to Google Drive now and then, as a second copy.<br>• Keep just one or two Drive files (replace the old one) instead of many.<br>• Use the same browser (Chrome) and the home-screen icon each time.</p>
  <p class="note"><b>Don't</b><br>• ❌ Don't clear browser data / cache / "site data" for Chrome. That wipes all entries.<br>• ❌ Don't use "Clear storage" in Android Settings → Apps → Chrome.<br>• ❌ Don't use Incognito/Private tabs. Nothing is saved there.<br>• ❌ Don't uninstall Chrome or the home-screen shortcut without a backup first.<br>• ❌ Don't restore an old file by mistake. It replaces newer entries.<br>• ❌ Don't share your GitHub token with anyone.</p>
  <p class="note"><b>New phone or lost data?</b> Open the app, go to Backup, then either Restore from file (choose your Drive file) or add your token + Gist ID and tap Download.</p></div>`;
}
function setS(k,v){db.settings[k]=v;save()}
function renVeh(id,n){n=n.trim();if(!n)return render();veh(id).name=n;save();toast('Renamed ✓')}
function maxVeh(id,m){m=parseFloat(m);if(m>0){veh(id).max=m;save();toast('Saved ✓')}}
function addVeh(){const n=$('#vn').value.trim();if(!n)return;db.vehicles.push({id:uid(),name:n,icon:/bike|moto|scoot/i.test(n)?'🏍️':'🚗'});save();render()}
function rmVeh(id){if(db.vehicles.length<2)return toast('Keep at least one');if(confirm('Remove vehicle and all its entries?')){db.vehicles=db.vehicles.filter(v=>v.id!==id);db.entries=db.entries.filter(e=>e.v!==id);vid=db.vehicles[0].id;save();render()}}
function mark(kind){
  const n=Date.now();db.settings[kind]=n;db.updated=n;db.settings.backedUpAt=n;
  localStorage.setItem(KEY,JSON.stringify(db));
}
const when=ts=>{if(!ts)return 'never';const d=Math.floor((Date.now()-ts)/864e5);return new Date(ts).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})+(d<1?' (today)':d===1?' (yesterday)':' ('+d+' days ago)')};
const lastBackup=()=>Math.max(db.settings.lastFile||0,db.settings.lastCloud||0);
const dirty=()=>db.entries.length>0&&(db.updated||0)>(db.settings.backedUpAt||0);
function statusHTML(){
  const lb=lastBackup(),old=lb&&Date.now()-lb>7*864e5;
  const ok=db.entries.length&&!dirty()&&!old;
  const msg=!db.entries.length?'No entries yet.':ok?'✅ All entries are backed up.':!lb?'⚠️ You have never backed up. Do it now.':dirty()?'⚠️ You have entries that are not backed up yet.':'⚠️ Last backup is over a week old.';
  return `<div class="card"><h3>Backup status</h3><p style="margin:0 0 8px;font-weight:700">${msg}</p>
  <div class="note">📁 Last file backup: ${when(db.settings.lastFile)}<br>☁ Last GitHub backup: ${when(db.settings.lastCloud)}</div></div>`;
}
const banner=()=>{const lb=lastBackup();return db.entries.length&&(!lb&&db.entries.length>=3||lb&&dirty()&&Date.now()-lb>7*864e5)?`<div class="card" style="background:#7c2d12;padding:12px" onclick="tab='settings';render()">⚠️ ${lb?'Last backup: '+when(lb):'No backup yet'} — tap to back up</div>`:''};
const clean=()=>{const {token,...s}=db.settings;return{...db,settings:s,exportedAt:Date.now()}};
async function exportFile(share){
  const name='fuel-tracker-backup.json';
  const blob=new Blob([JSON.stringify(clean(),null,2)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  if(share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});mark('lastFile');render();toast('Shared ✓')}catch{}
    return;
  }
  if(share)toast('Share not supported — downloading instead');
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  mark('lastFile');render();toast('Saved to Downloads ✓');
}
function importFile(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.vehicles||!d.entries)throw 0;if(!confirm('Replace current data with this backup ('+d.entries.length+' entries'+(d.exportedAt?', saved '+new Date(d.exportedAt).toLocaleString():'')+')?'))return;d.settings={...db.settings,...(d.settings||{})};db=d;vid=db.vehicles[0].id;save();mark('lastImport');render();toast('Imported ✓')}catch{toast('Invalid file')}};
  r.readAsText(file);
}
async function gh(url,opt){
  const r=await fetch('https://api.github.com'+url,{...opt,headers:{Authorization:'Bearer '+db.settings.token,Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error(r.status);return r.json();
}
async function pushGist(silent){
  if(!db.settings.token)return silent||toast('Add a token first');
  try{
    const files={'fuel-tracker.json':{content:JSON.stringify(clean())}};
    if(db.settings.gistId)await gh('/gists/'+db.settings.gistId,{method:'PATCH',body:JSON.stringify({files})});
    else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Fuel Tracker backup',public:false,files})});db.settings.gistId=g.id;save()}
    mark('lastCloud');toast('Uploaded ☁');if(tab==='settings')render();
  }catch(e){toast('Upload failed ('+e.message+')')}
}
async function pullGist(){
  if(!db.settings.token)return toast('Paste your token first');
  try{
    if(!db.settings.gistId){
      const list=await gh('/gists?per_page=100');
      const hit=list.find(x=>x.files&&x.files['fuel-tracker.json']);
      if(!hit)return toast('No Fuel Tracker backup found in this account');
      db.settings.gistId=hit.id;
    }
    const g=await gh('/gists/'+db.settings.gistId);
    const d=JSON.parse(g.files['fuel-tracker.json'].content);
    if(!confirm('Replace data on this phone with the cloud backup ('+(d.entries||[]).length+' entries, last saved '+new Date(d.updated||0).toLocaleString()+')?'))return;
    d.settings={...db.settings,...d.settings};db=d;vid=db.vehicles[0].id;save();mark('lastPull');render();toast('Downloaded ☁');
  }catch(e){toast('Download failed ('+e.message+')')}
}
function render(){
  $('#app').innerHTML=views();$('#app').className=tab==='add'?'home':'';
  $('#nav').innerHTML=[['add','＋','Add'],['stats','📊','Stats'],['reports','💰','Spends'],['history','🧾','History'],['settings','⚙️','Backup']].map(([k,i,n])=>`<button class="${(tab===k||(tab==='edit'&&k==='history'))?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${n}</button>`).join('');
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();
</script>
</body>
</html>
